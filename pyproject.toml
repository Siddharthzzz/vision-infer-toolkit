[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "infer_toolkit"
version = "0.0.1"
description = "Vision Inference Optimization Toolkit: PyTorch -> ONNX -> TensorRT (FP32/FP16/INT8 PTQ/QAT)"
requires-python = ">=3.12,<3.13"
license = { text = "Apache-2.0" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests/python"]
markers = ["gpu: needs an NVIDIA GPU + CUDA stack (skipped in CI)"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY", "SIM"]
